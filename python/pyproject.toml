[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "os-concepts-simulator"
version = "0.1.0"
description = "Reference CPU schedulers that generate the expected outputs the TypeScript engine is tested against."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[project.scripts]
osim-ref = "os_concepts_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
os_concepts_simulator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
extend-exclude = [".venv", ".tmp"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
