<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>CPU scheduling simulator</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem auto; max-width: 60rem; padding: 0 1rem; }
    textarea { width: 100%; height: 14rem; font-family: ui-monospace, monospace; }
    table { border-collapse: collapse; margin: 1rem 0; }
    td { border: 1px solid #999; padding: 0.25rem 0.5rem; text-align: right; }
    td:first-child { text-align: left; }
    pre { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>CPU scheduling simulator</h1>
  <p>Edit the trace (jobs with id, arrival, burst and priority), then run FCFS, SJF, SRTF,
    round robin and priority scheduling on it. The simulation runs in a Web Worker in this tab;
    nothing is sent to a server.</p>
  <label for="trace">Trace (JSON)</label>
  <textarea id="trace" spellcheck="false"></textarea>
  <p><label>Round-robin quantum <input id="quantum" type="number" min="1" max="1000" value="2"></label>
    <button id="run" type="button">Run all algorithms</button></p>
  <p id="status" role="status"></p>
  <div id="output"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
