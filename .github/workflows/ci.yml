name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      # tsc strict, ruff, mypy, expected outputs current; engine and reference tests; page build.
      - name: Lint, test and build
        run: |
          set -o pipefail
          make ci 2>&1 | tee ci.log
          echo "::notice title=tests::$(grep -E '^ℹ (pass|fail) ' ci.log | tr '\n' ' ') python: $(grep -E 'passed' ci.log | tail -1)"
      - name: Comparison of every algorithm on every trace
        run: make bench
      - name: Known-vulnerability audit
        run: |
          mkdir -p .tmp
          make audit
